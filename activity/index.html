<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fateless GW</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f7f7f5; --hover: #efefed; --line: #e9e9e7;
    --text: #37352f; --muted: #787774; --faint: #a5a29d;
    --ink: #191919; --danger: #e03e3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100dvh; }
  body { font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums; padding: 0 24px calc(48px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .muted { color: var(--muted); }

  /* Page header, Notion style */
  .icon { width: 72px; height: 72px; background: var(--ink); color: #fff; border-radius: 6px; display: grid;
    place-items: center; font-size: 36px; margin: 48px 0 16px; }
  h1 { font-size: 36px; line-height: 1.2; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
  .props { display: grid; grid-template-columns: 140px 1fr; row-gap: 4px; color: var(--muted); padding-bottom: 12px;
    border-bottom: 1px solid var(--line); }
  .props b { font-weight: 400; color: var(--text); }
  .banner { margin: 28px 0 8px; background: var(--ink); padding: 6px; border-radius: 2px;
    background-image: repeating-linear-gradient(90deg, #fff 0 6px, var(--ink) 6px 12px); }
  .banner div { background: var(--ink); color: #fff; text-align: center; font-weight: 700; letter-spacing: .3em;
    padding: 6px; font-size: 13px; }
  .banner span { background: #fff; color: var(--ink); padding: 2px 14px; }
  h2 { font-size: 16px; font-weight: 700; color: var(--ink); margin: 28px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2 .muted { font-weight: 400; font-size: 14px; }

  /* Day cards */
  .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .day { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; text-align: left; cursor: pointer;
    padding: 12px 14px; box-shadow: 0 1px 2px rgba(15, 15, 15, .04); }
  .day:hover { background: var(--surface); }
  .day.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .day .t { color: var(--muted); font-size: 12px; }
  .day .n { font-size: 28px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .day .n small { font-size: 14px; color: var(--faint); font-weight: 400; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .bar i.full { background: var(--danger); }

  /* Weapons + roster */
  .grid { display: grid; grid-template-columns: 280px 1fr; gap: 32px; }
  .seg { display: inline-flex; gap: 2px; margin-left: auto; }
  .seg button { background: none; border: 0; border-radius: 4px; padding: 2px 8px; cursor: pointer; color: var(--muted);
    font-size: 13px; }
  .seg button:hover { background: var(--hover); }
  .seg button.on { background: var(--ink); color: #fff; }
  .w { display: grid; grid-template-columns: 1fr 56px 20px; align-items: center; gap: 10px; width: 100%;
    padding: 4px 6px; background: none; border: 0; border-radius: 4px; cursor: pointer; text-align: left; }
  .w:hover { background: var(--hover); }
  .w.on { background: var(--ink); color: #fff; }
  .w.on .bar { background: #555; } .w.on .bar i { background: #fff; } .w.on .c { color: #fff; }
  .w .bar { margin: 0; }
  .w.dim { opacity: .45; }
  .w .c { text-align: right; color: var(--muted); }
  .unused { color: var(--faint); padding: 6px; font-size: 13px; }
  details summary { list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details:not([open]) h2::after { content: "▸"; color: var(--faint); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .chips:empty { display: none; }
  .chip { background: var(--hover); border: 0; border-radius: 3px; padding: 0 6px; cursor: pointer; font-size: 13px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 400; color: var(--muted); font-size: 13px; }
  td, th { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th + th, td + td { border-left: 1px solid var(--line); }
  tr:hover td { background: var(--surface); }
  .tag { background: var(--hover); border-radius: 3px; padding: 0 6px; font-size: 13px; white-space: nowrap; }
  .r2 { display: none; }
  .empty { color: var(--faint); padding: 16px 8px; }

  @media (max-width: 680px) {
    body { padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
    .icon { width: 56px; height: 56px; font-size: 28px; margin-top: 28px; }
    h1 { font-size: 28px; }
    .props { grid-template-columns: 110px 1fr; }
    .days { gap: 8px; }
    .day { padding: 10px; }
    .day .n { font-size: 22px; }
    .grid { grid-template-columns: 1fr; gap: 0; }
    thead, .col { display: none; }
    .r2 { display: block; color: var(--muted); font-size: 13px; }
    th + th, td + td { border-left: 0; }
  }
  @media (min-width: 681px) { details > summary { pointer-events: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">⚔</div>
  <h1>Fateless · Guild War</h1>
  <div class="props">
    <span>📅 Week of</span><b id="week"></b>
    <span>👥 Registered</span><b id="total"></b>
    <span>🔄 Resets</span><b>Every Monday</b>
  </div>

  <div class="banner"><div><span>GUILD WAR ROSTER</span></div></div>

  <h2>Slots</h2>
  <section class="days" id="days"></section>

  <section class="grid">
    <details id="wbox" open>
      <summary><h2>Weapons <span class="muted" id="wsel"></span></h2></summary>
      <div id="weapons"></div>
    </details>
    <div>
      <h2>Roster <span class="seg" id="roles"></span></h2>
      <div class="chips" id="chips"></div>
      <table>
        <thead><tr><th>Aa Name</th><th>Weapons</th><th>Team</th><th>Day</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const CLIENT_ID = "1561639617776590889";
const DB = "/fb";  // proxied to Firebase by the Activity URL mapping
const DAY_MAX = 30, RESERVE_MAX = 60;
const WEAPONS = [
  "Nameless Sword","Nameless Spear","Stormbreaker Spear","Thundercry Blade",
  "Infernal Twinblades","Mortal Rope Dart","Vernal Umbrella","Inkwell Fan",
  "Panacea Fan","Soulshade Umbrella","Heavenquaker Spear","Strategic Sword",
  "Snowparting Blade","Phalanxbane Blade","Everspring Umbrella","Unfettered Rope Dart",
  "Heavenwill Gauntlets","Skygrasp Rope Dart"
];
const TEAM = { attack: "Attack", defend: "Defend" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function weekKey() {
  const now = new Date(Date.now() + 7 * 3600e3);  // Cambodia time
  const day = now.getUTCDay();
  now.setUTCDate(now.getUTCDate() - (day === 0 ? 6 : day - 1));
  return now.toISOString().slice(0, 10);
}
const WEEK = weekKey();
const REGS = `${DB}/guild_wars/${WEEK}/registrations`;
$("week").textContent = new Date(WEEK + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

/* ---------- Discord connection (Embedded App postMessage protocol) ---------- */
const params = new URLSearchParams(location.search);
const pending = {};
function rpc(cmd, args) {
  const nonce = crypto.randomUUID();
  window.parent.postMessage([1, { cmd, nonce, args }], "*");
  return new Promise((res, rej) => pending[nonce] = { res, rej });
}
let readyResolve; const ready = new Promise(r => readyResolve = r);
window.addEventListener("message", ({ data }) => {
  if (!Array.isArray(data)) return;
  const [, msg] = data;
  if (!msg) return;
  if (msg.evt === "READY") return readyResolve();
  const p = pending[msg.nonce];
  if (!p) return;
  delete pending[msg.nonce];
  msg.evt === "ERROR" ? p.rej(msg.data) : p.res(msg.data);
});
window.parent.postMessage([0, { v: 1, encoding: "json", client_id: CLIENT_ID,
  frame_id: params.get("frame_id") }], "*");

let me = null;

/* ---------- Data + filters ---------- */
let players = [];
const filter = { day: null, team: null, weapon: null };  // day: Saturday | Sunday | reserve

async function load() {
  try {
    const val = await (await fetch(`${REGS}.json`)).json();
    players = Object.entries(val || {}).map(([key, p]) => ({ key, ...p }))
      .sort((a, b) => a.registeredAt - b.registeredAt);
    render();
  } catch { $("total").textContent = "offline"; }
}

const sat = p => p.avail === "Saturday" || p.avail === "Sat & Sun";
const sun = p => p.avail === "Sunday" || p.avail === "Sat & Sun";
const isMe = p => me && p.name.toLowerCase() === me.name.toLowerCase();
const match = {
  day: (p, v) => v === "reserve" ? p.isReserve : !p.isReserve && (v === "Saturday" ? sat(p) : sun(p)),
  team: (p, v) => p.team === v,
  weapon: (p, v) => p.weapon1 === v || p.weapon2 === v,
};
// Every visual is filtered by the *other* dimensions, never by itself (Power BI cross-filter).
const filtered = (except) => players.filter(p =>
  Object.entries(filter).every(([k, v]) => k === except || v === null || match[k](p, v)));
function toggle(k, v) { filter[k] = filter[k] === v ? null : v; render(); }
addEventListener("keydown", e => { if (e.key === "Escape") { for (const k in filter) filter[k] = null; render(); } });

function render() {
  $("total").textContent = players.length + " players";

  // Day strip — the KPIs and the day filter in one
  const forDays = filtered("day"), main = forDays.filter(p => !p.isReserve);
  const cells = [["Saturday", main.filter(sat).length, DAY_MAX], ["Sunday", main.filter(sun).length, DAY_MAX],
                 ["reserve", forDays.length - main.length, RESERVE_MAX]];
  $("days").innerHTML = cells.map(([d, n, max]) => {
    const pct = n / max, cls = pct >= 1 ? "full" : pct >= .9 ? "hot" : "";
    return `<button class="day ${filter.day === d ? "on" : ""}" data-d="${d}">
      <div class="t">${d === "reserve" ? "Reserve" : d}</div>
      <div class="n">${n} <small>/ ${max}</small></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100, pct * 100)}%"></i></div></button>`;
  }).join("");
  $("days").querySelectorAll(".day").forEach(b => b.onclick = () => toggle("day", b.dataset.d));

  // Weapons — only the ones in use
  const wc = {};
  filtered("weapon").forEach(p => [p.weapon1, p.weapon2].forEach(w => w && (wc[w] = (wc[w] || 0) + 1)));
  const used = Object.entries(wc).sort((a, b) => b[1] - a[1]), max = used[0]?.[1] || 1;
  $("weapons").innerHTML = used.map(([w, n]) => `<button class="w ${filter.weapon === w ? "on" : filter.weapon ? "dim" : ""}" data-w="${esc(w)}">
      <span>${esc(w)}</span><span class="bar"><i style="width:${n / max * 100}%"></i></span><span class="c">${n}</span></button>`).join("")
    + (used.length < WEAPONS.length ? `<div class="unused">+${WEAPONS.length - used.length} unused</div>` : "");
  $("weapons").querySelectorAll(".w").forEach(b => b.onclick = () => toggle("weapon", b.dataset.w));
  $("wsel").textContent = filter.weapon ? "— " + filter.weapon : "";

  // Team segmented filter
  const forTeam = filtered("team");
  const tc = t => forTeam.filter(p => p.team === t).length;
  $("roles").innerHTML = [[null, "All"], ["attack", "Attack " + tc("attack")], ["defend", "Defend " + tc("defend")]]
    .map(([t, l]) => `<button class="${filter.team === t ? "on" : ""}" data-t="${t ?? ""}">${l}</button>`).join("");
  $("roles").querySelectorAll("button").forEach(b => b.onclick = () => {
    filter.team = b.dataset.t || null; render(); });

  // Active filter chips
  const names = { day: v => v === "reserve" ? "Reserve" : v, team: v => TEAM[v], weapon: v => v };
  const active = Object.entries(filter).filter(([, v]) => v !== null);
  $("chips").innerHTML = active.map(([k, v]) => `<button class="chip" data-k="${k}">${esc(names[k](v))} ×</button>`).join("")
    + (active.length ? `<button class="link" id="clear">Clear</button>` : "");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter[b.dataset.k] = null; render(); });
  if (active.length) $("clear").onclick = () => { for (const k in filter) filter[k] = null; render(); };

  // Roster — you first
  const rows = filtered(null).sort((a, b) => isMe(b) - isMe(a));
  $("rows").innerHTML = rows.map(p => {
    const team = TEAM[p.team] || "—", day = p.isReserve ? p.avail + " · reserve" : p.avail;
    return `<tr class="${isMe(p) ? "me" : ""}"><td>${esc(p.name)}
      <div class="r2">${esc(p.weapon1)} / ${esc(p.weapon2)} · ${team} · ${esc(day)}</div></td>
      <td class="col">${esc(p.weapon1)} / ${esc(p.weapon2)}</td><td class="col"><span class="tag">${team}</span></td>
      <td class="col muted">${esc(day)}</td></tr>`;
  }).join("") || `<tr><td colspan="4" class="empty">${players.length ? "No one matches these filters" : "No registrations yet"}</td></tr>`;

}

/* ---------- Start ---------- */
if (innerWidth <= 640) $("wbox").open = false;
load();
setInterval(load, 5000);
</script>
</body>
</html>
