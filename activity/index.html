<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fateless GW</title>
<style>
  :root {
    --bg: #2b2d31; --surface: #35373c; --line: #3f4147;
    --text: #f2f3f5; --muted: #b5bac1; --faint: #80848e;
    --accent: #d4a84a; --accent-weak: rgba(212, 168, 74, .14);
    --danger: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100dvh; }
  body { font: 13px/20px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  button, select { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .label { font-size: 11px; line-height: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .muted { color: var(--muted); }

  header { display: flex; align-items: center; gap: 12px; padding: 20px 0 16px; border-bottom: 1px solid var(--line); }
  header .logo { width: 40px; height: 40px; border-radius: 50%; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header .muted { margin-left: auto; }

  /* Register bar */
  #reg { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; }
  .form { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .who { display: flex; align-items: center; gap: 8px; margin-right: 8px; font-weight: 600; }
  .who img { width: 24px; height: 24px; border-radius: 50%; background: var(--line); }
  select, .wpick { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; height: 36px; padding: 0 8px;
    min-width: 170px; font-size: 16px; }
  @media (min-width: 640px) { select { font-size: 13px; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; height: 34px; padding: 0 12px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-weak); color: var(--accent); }
  .seg button .full { color: var(--danger); font-size: 11px; }
  .go { margin-left: auto; height: 36px; padding: 0 20px; border: 0; border-radius: 6px; background: var(--accent);
    color: #111; font-weight: 600; cursor: pointer; }
  .go:disabled { background: var(--line); color: var(--faint); cursor: default; }
  .status { display: flex; align-items: center; gap: 8px; }
  .status .ok { color: var(--accent); }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; margin-left: auto; }
  .msg { color: var(--danger); margin-top: 8px; }
  .msg:empty { display: none; }

  /* Day strip */
  .days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 24px 0; }
  .day { background: none; border: 0; text-align: left; cursor: pointer; padding: 8px; margin: -8px; border-radius: 6px; }
  .day:hover { background: var(--surface); }
  .day.on { background: var(--accent-weak); }
  .day.on .label { color: var(--accent); }
  .day .n { font-size: 28px; line-height: 32px; font-weight: 600; margin: 4px 0 8px; }
  .day .n small { font-size: 13px; color: var(--muted); font-weight: 400; }
  .bar { height: 2px; background: var(--line); }
  .bar i { display: block; height: 100%; background: var(--muted); }
  .bar i.hot { background: var(--accent); }
  .bar i.full { background: var(--danger); }

  /* Weapons + roster */
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  .head { display: flex; align-items: center; gap: 8px; height: 36px; border-bottom: 1px solid var(--line); }
  .head .seg { margin-left: auto; }
  .head .seg button { height: 28px; font-size: 12px; }
  .w { display: grid; grid-template-columns: 1fr 64px 24px; align-items: center; gap: 12px; width: 100%; height: 32px;
    padding: 0 8px; background: none; border: 0; border-radius: 6px; cursor: pointer; text-align: left; }
  .w:hover { background: var(--surface); }
  .w.on { background: var(--accent-weak); color: var(--accent); }
  .w .bar { height: 4px; border-radius: 2px; }
  .w.dim .bar i { opacity: .35; }
  .w .c { text-align: right; color: var(--muted); }
  .unused { color: var(--faint); padding: 8px; }
  details summary { list-style: none; }
  details summary::-webkit-details-marker { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; }
  .chips:empty { display: none; }
  .chip { background: var(--accent-weak); color: var(--accent); border: 0; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 400; }
  td, th { height: 36px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  tr.me td:first-child { box-shadow: inset 2px 0 var(--accent); }
  .r2 { display: none; }
  .empty { color: var(--faint); padding: 16px 8px; }

  @media (max-width: 640px) {
    .days { gap: 16px; }
    .day .n { font-size: 22px; line-height: 28px; }
    .grid { grid-template-columns: 1fr; }
    .form select, .form .wpick { flex: 1 1 100%; }
    .form .seg { flex: 1; }
    .form .seg button { flex: 1; height: 40px; }
    .go { flex: 1 1 100%; height: 44px; margin: 0; }
    .head .seg button { height: 32px; }
    thead, .col { display: none; }
    .r2 { display: block; color: var(--muted); }
    td { height: auto; padding: 8px; }
  }
  @media (min-width: 641px) { details[open] > summary, details > summary { pointer-events: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><img class="logo" src="logo.webp" alt=""><h1>FATELESS GW</h1><span class="muted" id="week"></span><span class="muted" id="total"></span></header>


  <section class="days" id="days"></section>

  <section class="grid">
    <details id="wbox" open>
      <summary class="head label">Weapons <span id="wsel"></span></summary>
      <div id="weapons"></div>
    </details>
    <div>
      <div class="head"><span class="label">Roster</span>
        <span class="seg" id="roles"></span></div>
      <div class="chips" id="chips"></div>
      <table>
        <thead><tr class="label"><th>Name</th><th>Weapons</th><th>Team</th><th>Day</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const CLIENT_ID = "1561639617776590889";
const DB = "/fb";  // proxied to Firebase by the Activity URL mapping
const DAY_MAX = 30, RESERVE_MAX = 60;
const WEAPONS = [
  "Nameless Sword","Nameless Spear","Stormbreaker Spear","Thundercry Blade",
  "Infernal Twinblades","Mortal Rope Dart","Vernal Umbrella","Inkwell Fan",
  "Panacea Fan","Soulshade Umbrella","Heavenquaker Spear","Strategic Sword",
  "Snowparting Blade","Phalanxbane Blade","Everspring Umbrella","Unfettered Rope Dart",
  "Heavenwill Gauntlets","Skygrasp Rope Dart"
];
const TEAM = { attack: "Attack", defend: "Defend" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function weekKey() {
  const now = new Date(Date.now() + 7 * 3600e3);  // Cambodia time
  const day = now.getUTCDay();
  now.setUTCDate(now.getUTCDate() - (day === 0 ? 6 : day - 1));
  return now.toISOString().slice(0, 10);
}
const WEEK = weekKey();
const REGS = `${DB}/guild_wars/${WEEK}/registrations`;
$("week").textContent = "Week of " + WEEK;

/* ---------- Discord connection (Embedded App postMessage protocol) ---------- */
const params = new URLSearchParams(location.search);
const pending = {};
function rpc(cmd, args) {
  const nonce = crypto.randomUUID();
  window.parent.postMessage([1, { cmd, nonce, args }], "*");
  return new Promise((res, rej) => pending[nonce] = { res, rej });
}
let readyResolve; const ready = new Promise(r => readyResolve = r);
window.addEventListener("message", ({ data }) => {
  if (!Array.isArray(data)) return;
  const [, msg] = data;
  if (!msg) return;
  if (msg.evt === "READY") return readyResolve();
  const p = pending[msg.nonce];
  if (!p) return;
  delete pending[msg.nonce];
  msg.evt === "ERROR" ? p.rej(msg.data) : p.res(msg.data);
});
window.parent.postMessage([0, { v: 1, encoding: "json", client_id: CLIENT_ID,
  frame_id: params.get("frame_id") }], "*");

let me = null;

/* ---------- Data + filters ---------- */
let players = [];
const filter = { day: null, team: null, weapon: null };  // day: Saturday | Sunday | reserve

async function load() {
  try {
    const val = await (await fetch(`${REGS}.json`)).json();
    players = Object.entries(val || {}).map(([key, p]) => ({ key, ...p }))
      .sort((a, b) => a.registeredAt - b.registeredAt);
    render();
  } catch { $("total").textContent = "· offline"; }
}

const sat = p => p.avail === "Saturday" || p.avail === "Sat & Sun";
const sun = p => p.avail === "Sunday" || p.avail === "Sat & Sun";
const isMe = p => me && p.name.toLowerCase() === me.name.toLowerCase();
const match = {
  day: (p, v) => v === "reserve" ? p.isReserve : !p.isReserve && (v === "Saturday" ? sat(p) : sun(p)),
  team: (p, v) => p.team === v,
  weapon: (p, v) => p.weapon1 === v || p.weapon2 === v,
};
// Every visual is filtered by the *other* dimensions, never by itself (Power BI cross-filter).
const filtered = (except) => players.filter(p =>
  Object.entries(filter).every(([k, v]) => k === except || v === null || match[k](p, v)));
function toggle(k, v) { filter[k] = filter[k] === v ? null : v; render(); }
addEventListener("keydown", e => { if (e.key === "Escape") { for (const k in filter) filter[k] = null; render(); } });

function render() {
  $("total").textContent = "· " + players.length + " registered";

  // Day strip — the KPIs and the day filter in one
  const forDays = filtered("day"), main = forDays.filter(p => !p.isReserve);
  const cells = [["Saturday", main.filter(sat).length, DAY_MAX], ["Sunday", main.filter(sun).length, DAY_MAX],
                 ["reserve", forDays.length - main.length, RESERVE_MAX]];
  $("days").innerHTML = cells.map(([d, n, max]) => {
    const pct = n / max, cls = pct >= 1 ? "full" : pct >= .9 ? "hot" : "";
    return `<button class="day ${filter.day === d ? "on" : ""}" data-d="${d}">
      <div class="label">${d === "reserve" ? "Reserve" : d}</div>
      <div class="n">${n} <small>/ ${max}</small></div>
      <div class="bar"><i class="${cls}" style="width:${Math.min(100, pct * 100)}%"></i></div></button>`;
  }).join("");
  $("days").querySelectorAll(".day").forEach(b => b.onclick = () => toggle("day", b.dataset.d));

  // Weapons — only the ones in use
  const wc = {};
  filtered("weapon").forEach(p => [p.weapon1, p.weapon2].forEach(w => w && (wc[w] = (wc[w] || 0) + 1)));
  const used = Object.entries(wc).sort((a, b) => b[1] - a[1]), max = used[0]?.[1] || 1;
  $("weapons").innerHTML = used.map(([w, n]) => `<button class="w ${filter.weapon === w ? "on" : filter.weapon ? "dim" : ""}" data-w="${esc(w)}">
      <span>${esc(w)}</span><span class="bar"><i style="width:${n / max * 100}%"></i></span><span class="c">${n}</span></button>`).join("")
    + (used.length < WEAPONS.length ? `<div class="unused">+${WEAPONS.length - used.length} unused</div>` : "");
  $("weapons").querySelectorAll(".w").forEach(b => b.onclick = () => toggle("weapon", b.dataset.w));
  $("wsel").textContent = filter.weapon ? "· " + filter.weapon : "";

  // Team segmented filter
  const forTeam = filtered("team");
  const tc = t => forTeam.filter(p => p.team === t).length;
  $("roles").innerHTML = [[null, "All"], ["attack", "Attack " + tc("attack")], ["defend", "Defend " + tc("defend")]]
    .map(([t, l]) => `<button class="${filter.team === t ? "on" : ""}" data-t="${t ?? ""}">${l}</button>`).join("");
  $("roles").querySelectorAll("button").forEach(b => b.onclick = () => {
    filter.team = b.dataset.t || null; render(); });

  // Active filter chips
  const names = { day: v => v === "reserve" ? "Reserve" : v, team: v => TEAM[v], weapon: v => v };
  const active = Object.entries(filter).filter(([, v]) => v !== null);
  $("chips").innerHTML = active.map(([k, v]) => `<button class="chip" data-k="${k}">${esc(names[k](v))} ×</button>`).join("")
    + (active.length ? `<button class="link" id="clear">Clear</button>` : "");
  $("chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { filter[b.dataset.k] = null; render(); });
  if (active.length) $("clear").onclick = () => { for (const k in filter) filter[k] = null; render(); };

  // Roster — you first
  const rows = filtered(null).sort((a, b) => isMe(b) - isMe(a));
  $("rows").innerHTML = rows.map(p => {
    const team = TEAM[p.team] || "—", day = p.isReserve ? p.avail + " · reserve" : p.avail;
    return `<tr class="${isMe(p) ? "me" : ""}"><td>${esc(p.name)}
      <div class="r2">${esc(p.weapon1)} / ${esc(p.weapon2)} · ${team} · ${esc(day)}</div></td>
      <td class="col">${esc(p.weapon1)} / ${esc(p.weapon2)}</td><td class="col muted">${team}</td>
      <td class="col muted">${esc(day)}</td></tr>`;
  }).join("") || `<tr><td colspan="4" class="empty">${players.length ? "No one matches these filters" : "No registrations yet"}</td></tr>`;

}

/* ---------- Start ---------- */
if (innerWidth <= 640) $("wbox").open = false;
load();
setInterval(load, 5000);
</script>
</body>
</html>
